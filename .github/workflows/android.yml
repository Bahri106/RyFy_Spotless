name: RyFy Spotless CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build RyFy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Auto-generate assets/changelog.json from version.json
        run: |
          mkdir -p app/src/main/assets
          python3 -c "import json; v=json.load(open('version.json')); json.dump(v.get('changelog', []), open('app/src/main/assets/changelog.json', 'w', encoding='utf-8'), indent=2)"

      - name: Build Android Release APK (Minified & Single Dex)
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Inspect APK Details
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "=== APK File Size ==="
            ls -lh "$APK_PATH"
            echo "=== Classes Dex Count ==="
            unzip -l "$APK_PATH" | grep "classes.*dex" || true
          fi

      - name: Upload APK to Catbox / Litterbox Mirror
        id: upload-mirror
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Uploading $APK_PATH to Litterbox..."
            UPLOAD_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$APK_PATH" https://litterbox.catbox.moe/resources/internals/api.php || true)
            echo "LITTERBOX_URL=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
            echo "Direct download mirror: $UPLOAD_URL"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryfy-spotless-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
