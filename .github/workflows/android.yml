name: RyFy Spotless CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build RyFy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload APK to Catbox / Litterbox Mirror
        id: upload-mirror
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Uploading $APK_PATH to Litterbox..."
            UPLOAD_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$APK_PATH" https://litterbox.catbox.moe/resources/internals/api.php || true)
            echo "LITTERBOX_URL=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
            echo "Direct download mirror: $UPLOAD_URL"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryfy-spotless-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
